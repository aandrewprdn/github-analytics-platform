[project]
name = "github-analytics-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Andrii", email = "andrunivermail@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "apache-airflow>=3.3.2",
    "boto3>=1.43.86",
    "dotenv>=0.9.9",
    "pandas>=3.0.5",
    "polars>=1.44.1",
    "psycopg[binary]>=3.3.5",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.54",
    "tenacity>=9.1.4",
]

[project.scripts]
github-analytics-platform = "github_analytics_platform:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "github_analytics_platform"
module-root = "src"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
