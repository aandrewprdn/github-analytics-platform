[project]
name = "github-analytics-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Andrii", email = "andrunivermail@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.86",
    "polars>=1.44.1",
    "psycopg>=3.3.5",
    "requests>=2.34.2",
]

[project.scripts]
github-analytics-platform = "github_analytics_platform:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
