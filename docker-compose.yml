x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__API__EXPOSE_CONFIG: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-api-server:8080/execution/"
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}
    # dbt/profiles.yml reads the host from DBT_HOST (defaults to localhost for local runs)
    DBT_HOST: postgres
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./src:/opt/airflow/src
    - ./dbt:/opt/airflow/dbt_project  # not ".../dbt": that folder would shadow the dbt package on sys.path
  depends_on:
    postgres:
      condition: service_healthy

services:
  # One-off tool container, not a long-running service:
  #   docker compose run --rm dbt build
  dbt:
    build:
      context: .
      dockerfile: docker/dbt/Dockerfile
    profiles: ["tools"]
    env_file: .env
    environment:
      DBT_PROFILES_DIR: /opt/dbt
      DBT_HOST: postgres
      DBT_PORT: 5432
    volumes:
      - ./dbt:/opt/dbt
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: de-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      retries: 5

  minio:
    image: quay.io/minio/aistor/minio:latest
    container_name: de-minio
    restart: unless-stopped
    command: server /data --console-address ":9001" --license ./minio.license
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
      - ./minio.license:/minio.license:ro

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate

  airflow-api-server:
    <<: *airflow-common
    container_name: airflow-api-server
    command: api-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
  
  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow-dag-processor
    command: dag-processor
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # metabase:
  #   image: metabase/metabase:latest
  #   container_name: de-metabase
  #   restart: unless-stopped
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

  # Dashboards as code (Markdown + SQL in ./evidence), queried live from the dbt marts.
  # Runs `evidence dev` so page edits reload instantly: http://localhost:3000
  evidence:
    image: evidencedev/serve:0.12.2
    container_name: de-evidence
    restart: unless-stopped
    command: ["evidence", "dev", "--host", "0.0.0.0", "--port", "3000"]
    environment:
      EVIDENCE_DB_HOST: postgres
      EVIDENCE_DB_NAME: ${POSTGRES_DB}
      EVIDENCE_DB_USER: ${EVIDENCE_DB_USER:-evidence_reader}
      EVIDENCE_DB_PASSWORD: ${EVIDENCE_DB_PASSWORD}
      EVIDENCE_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:3000:3000"  # localhost only: the dev server has no login
    volumes:
      - ./evidence:/project
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: de-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
